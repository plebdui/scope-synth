# Builds the Mac plugin (AU for GarageBand/Logic, plus VST3 and CLAP) as one
# universal binary for Intel and Apple Silicon, then checks the AU with
# Apple's auval, the same validator Logic runs.
name: macOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      CFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
      CXXFLAGS: -arch x86_64 -arch arm64 -mmacosx-version-min=10.15
    steps:
      - uses: actions/checkout@v4

      - name: DPF (pinned) with the patch
        run: |
          git clone https://github.com/DISTRHO/DPF.git dpf
          git -C dpf checkout 4238e1c7f0351bbe488d79f0899c540543ac7583
          git -C dpf submodule update --init --recursive
          git -C dpf apply ../patches/dpf-wine-pixel-format.patch

      - name: Engine test
        run: |
          clang++ -std=c++17 -O2 -I. tests/engine_test.cpp -o engine_test
          ./engine_test

      - name: Build
        run: |
          make -C dpf/dgl opengl -j3
          make -j3
          codesign --force --deep -s - bin/Scope-Synth.component bin/Scope-Synth.vst3 bin/Scope-Synth.clap
          lipo -info bin/Scope-Synth.component/Contents/MacOS/Scope-Synth

      - name: auval (Apple's Audio Unit validator)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R bin/Scope-Synth.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i "scsy" || true
          auval -strict -v aumu ScSy Pleb

      - name: Zip
        run: |
          cd bin
          zip -qry ../Scope-Synth-mac.zip Scope-Synth.component Scope-Synth.vst3 Scope-Synth.clap

      - uses: actions/upload-artifact@v4
        with:
          name: Scope-Synth-mac
          path: Scope-Synth-mac.zip
